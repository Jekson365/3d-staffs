<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Furniture Prompt Maker</title>
<style>
  :root {
    --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b6760; --line: #dcd8d0;
    --accent: #2f6f5e; --accent-ink: #ffffff; --warn: #a3471c; --ok: #2f6f5e; --code: #f8f7f4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #201f1d; --ink: #ecebe7; --muted: #a29e96; --line: #3a3834;
      --accent: #5fb39b; --accent-ink: #10201b; --warn: #e3875c; --ok: #5fb39b; --code: #1a1a18;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
  label { display: block; font-weight: 600; font-size: 13px; margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  label .opt { font-weight: 400; color: var(--muted); }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 10px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea { resize: vertical; min-height: 60px; }
  .size { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; min-height: 1em; }
  .hint.warn { color: var(--warn); }
  .hint.ok { color: var(--ok); }
  .preview { margin-top: 10px; border: 1px dashed var(--line); border-radius: 8px; min-height: 120px; display: grid;
    place-items: center; overflow: hidden; background: var(--code); color: var(--muted); font-size: 13px; text-align: center; padding: 6px; }
  .preview img { max-width: 100%; max-height: 260px; display: block; border-radius: 4px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .bar h2 { font-size: 15px; margin: 0 auto 0 0; }
  button { font: inherit; font-weight: 600; border-radius: 7px; padding: 7px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font: 12.5px/1.55 ui-monospace, Consolas, monospace;
    background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-height: 72vh; overflow: auto; }
  .status { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Furniture prompt maker</h1>
  <p class="sub">Fill in a picture and a name. The prompt for a new piece in <code>furniture\</code> is written as you type.</p>

  <div class="grid">
    <section class="card" aria-label="Piece">
      <label for="url">Image URL or file path</label>
      <input id="url" type="text" placeholder="https://… .jpg / .webp, or C:\…\photo.jpg" autocomplete="off">
      <div class="preview" id="preview">No picture yet</div>

      <label for="name">Name <span class="opt">(label in the Furniture panel)</span></label>
      <input id="name" type="text" placeholder="Round table" autocomplete="off">

      <label for="id">Id <span class="opt">(file name, made from the name)</span></label>
      <input id="id" type="text" placeholder="roundTable" autocomplete="off" spellcheck="false">
      <div class="hint" id="idHint"></div>

      <label for="what">What it is <span class="opt">(optional)</span></label>
      <textarea id="what" placeholder="round oak dining table with one central leg"></textarea>

      <label>Size in metres <span class="opt">(optional: width, depth, height)</span></label>
      <div class="size">
        <input id="w" type="number" min="0" step="0.01" placeholder="width">
        <input id="d" type="number" min="0" step="0.01" placeholder="depth">
        <input id="h" type="number" min="0" step="0.01" placeholder="height">
      </div>

      <label for="mats">Colours / materials <span class="opt">(optional)</span></label>
      <input id="mats" type="text" placeholder="oak top, black metal leg" autocomplete="off">

      <label for="flat">Also put it into a flat <span class="opt">(optional: data name and where)</span></label>
      <input id="flat" type="text" placeholder="onebed75, by the living-room window" autocomplete="off">
    </section>

    <section class="card" aria-label="Prompt">
      <div class="bar">
        <h2>Prompt</h2>
        <span class="status" id="status"></span>
        <button id="dl" type="button">Download .txt</button>
        <button id="copy" type="button" class="primary">Copy prompt</button>
      </div>
      <pre id="out"></pre>
    </section>
  </div>
</main>

<!-- The prompt. {{tokens}} are filled from the form; keep it in step with prompt-furniture.txt. -->
<script type="text/plain" id="tpl"># Make a New Furniture Piece

Make a new 3D furniture piece for the flat template in `"{{root}}"` and save it in its `furniture\` folder.

- What it is: {{what}}
- Label in the Furniture panel: {{name}}
- Photo: {{url}}
- Size in metres: {{size}}
- Colours / materials: {{mats}}
- Also put it into a flat: {{flat}}

## Instructions

1. Read `CLAUDE.md` (Rules, Builder cheat sheet, Gotchas) and `furniture\README.md`. Do not read whole engine files: grep and read only the part you need.
2. {{photoStep}}
3. Look at one or two existing pieces of the same kind in `furniture\` (and the shared parts in `furniture\_parts.js`) and reuse their helpers.
4. {{idStep}}
5. Write `furniture\{{id}}.js`:
   - `'use strict';`, then a comment with the size and its native direction (the front or the sitter faces south, +Z).
   - `piece('{{id}}', { name: '{{nameJs}}', add: <next free number after the highest add: in the folder>, values: { ... } }, function (p) { pAt(p, () => { ... }); });`
   - Build it centred on its own origin, standing on the floor (y0 = 0), true to the photo and the size above.
   - Use materials that already exist in `source\src\20-mats.js`. Let the main colour be a value (`p.mat` with a default) when that makes sense.
     If no existing material fits, stop and tell me: a new material changes the engine and means rebuilding every flat.
   - Add a collider (`colRect` / `colCircle`) covering its footprint. Lamps with `pLamp`, mirrors with `pMirror`, things hanging from the ceiling inside `into(CEIL, ...)`.
   - Keep light stand-ins inside the visible shape; small or thin parts get `occ: false`.
   - Keep the mesh light: modest `seg` and `cell`; no more detail than shows from 1 m away.
6. From `source\`, run `node tools/furniture-index.mjs`. It must accept the file.
7. Add a row for the piece to the furniture table in `source\flats\FORMAT.md` (size, native direction, values).
8. Test it in the showroom: put it in `source\flats\showroom.json` in place of the current showcase piece (keep 0.8 m walkways),
   then `node tools/build.mjs showroom`, `node tools/walktest.mjs showroom` and `node tools/walktest.mjs showroom touch`.
9. Take up to three screenshots of it in the showroom (front three-quarter, side, from above). Compare them with the photo and fix the proportions.
   Check the output for `[exception]` lines. Delete `source\dist\shots` when done.
10. {{flatStep}}
11. Add one line about the piece to the State section of `CLAUDE.md`.

## Completion criteria

- `furniture-index.mjs` accepts the file and lists it.
- Both showroom walk tests report `RESULT: PASS`.
- The screenshots match the photo and the size.
- No other piece, flat or engine file changed (except `showroom.json`, `FORMAT.md`, `CLAUDE.md`{{flatTouched}}).

## Cost constraints

- At most three screenshots.
- Use text checks otherwise.
- Do not ask questions unless blocked.

## Final response

Provide:
1. Path of the new piece file and its id.
2. Its size, materials and the values it takes.
3. What you assumed.
4. What you did not check.
</script>

<!-- Existing piece ids: furniture/index.js normally writes one script tag per piece; here those tags are only collected. -->
<script>
  window.__pieceIds = null;
  (function () {
    var realWrite = document.write;
    var seen = [];
    document.write = function (s) { seen.push(String(s)); };
    window.__restoreWrite = function () {
      document.write = realWrite;
      var ids = [];
      seen.forEach(function (s) { var m = /\/([^/"]+)\.js"/.exec(s); if (m && m[1].charAt(0) !== '_') ids.push(m[1]); });
      if (seen.length) window.__pieceIds = ids;
    };
  })();
</script>
<script src="furniture/index.js" onerror="void 0"></script>
<script>window.__restoreWrite();</script>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const F = ['url', 'name', 'id', 'what', 'w', 'd', 'h', 'mats', 'flat'];
const TPL = $('tpl').textContent;
const EXISTING = window.__pieceIds;            // null when furniture/index.js could not be read
const FALLBACK_ROOT = 'C:\\Users\\Jeko\\Desktop\\flat-3d - Copy';

// The project folder is the one this page sits in.
function projectRoot() {
  if (location.protocol !== 'file:') return FALLBACK_ROOT;
  const p = decodeURIComponent(location.pathname).replace(/^\/([A-Za-z]:)/, '$1').replace(/\//g, '\\');
  return p.slice(0, p.lastIndexOf('\\')) || FALLBACK_ROOT;
}
const ROOT = projectRoot();

// "Round oak table" -> "roundOakTable"; empty when the name has no Latin letters or digits.
function idFrom(name) {
  const words = name.normalize('NFKD').replace(/[\u0300-\u036f]/g, '').match(/[A-Za-z0-9]+/g) || [];
  let id = words.map((w, i) => (i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase())).join('');
  if (/^[0-9]/.test(id)) id = 'p' + id;
  return id.slice(0, 40);
}
const validId = (s) => /^[a-z][A-Za-z0-9]*$/.test(s);

let idTouched = false;

function sizeText(w, d, h) {
  const parts = [['width', w], ['depth', d], ['height', h]];
  const given = parts.filter(([, v]) => v !== '');
  if (!given.length) return 'not given: read it from the photo (or its product page) and estimate from usual sizes; say what you assumed';
  const txt = parts.map(([k, v]) => k + ' ' + (v === '' ? '?' : v)).join(' x ');
  return given.length === 3 ? txt : txt + ' (estimate the missing ones from the photo)';
}

function previewSrc(url) {
  if (/^[A-Za-z]:\\/.test(url)) return 'file:///' + url.replace(/\\/g, '/');
  if (/^https?:\/\//i.test(url) || /^file:\/\//i.test(url)) return url;
  return '';
}

function render() {
  const v = {};
  F.forEach((k) => { v[k] = $(k).value.trim(); });
  if (!idTouched) { $('id').value = idFrom(v.name); v.id = $('id').value; }

  // id check
  const hint = $('idHint');
  hint.className = 'hint';
  if (!v.id) hint.textContent = v.name ? 'No id from this name: type one (Latin letters, camelCase).' : '';
  else if (!validId(v.id)) { hint.textContent = 'Use Latin letters and digits, starting with a small letter (camelCase).'; hint.className = 'hint warn'; }
  else if (EXISTING && EXISTING.includes(v.id)) { hint.textContent = '"' + v.id + '" already exists in furniture\\. Pick another id.'; hint.className = 'hint warn'; }
  else if (EXISTING) { hint.textContent = 'Free (' + EXISTING.length + ' pieces in furniture\\).'; hint.className = 'hint ok'; }
  else hint.textContent = 'Could not read furniture\\index.js, so the id was not checked.';

  const idOk = v.id && validId(v.id) && !(EXISTING && EXISTING.includes(v.id));
  const id = idOk ? v.id : '<id>';
  const tokens = {
    root: ROOT,
    what: v.what || 'take it from the photo',
    name: v.name || '<name>',
    nameJs: (v.name || '<name>').replace(/\\/g, '\\\\').replace(/'/g, "\\'"),
    url: v.url || '<image URL>',
    size: sizeText(v.w, v.d, v.h),
    mats: v.mats || 'as in the photo, with the closest existing materials',
    flat: v.flat || 'no',
    id,
    photoStep: 'Download the photo into a new empty folder in your scratchpad and look at it (turn a WebP into a PNG with Python/Pillow first if needed). '
      + 'If it cannot be downloaded or opened, stop and tell me.',
    idStep: idOk
      ? 'Use the id `' + id + '` (file `furniture\\' + id + '.js`). If that file already exists, choose another id; never overwrite a piece.'
      : 'Pick a short camelCase id. If `furniture\\<id>.js` already exists, choose another id; never overwrite a piece.',
    flatStep: v.flat
      ? 'Put it into the flat I named: add it to that flat\'s `furniture` in `source\\flats\\<name>.json`, rebuild with the offline path '
        + '`node tools/build.mjs <name> "../results/<folder>/<file>.html"`, and run both walk tests. Do not republish anything unless I ask.'
      : 'Do not put it into any flat, and do not republish anything.',
    flatTouched: v.flat ? ' and the flat I named' : '',
  };
  const text = TPL.replace(/\{\{(\w+)\}\}/g, (m, k) => (k in tokens ? tokens[k] : m)).replace(/\n+$/, '\n');
  $('out').textContent = text;

  const missing = [];
  if (!v.url) missing.push('an image');
  if (!v.name) missing.push('a name');
  if (v.id && !idOk) missing.push('a free id');
  $('copy').disabled = $('dl').disabled = missing.length > 0;
  $('status').textContent = missing.length ? 'Needs ' + missing.join(' and ') : '';
  return text;
}

// picture preview, refreshed only when the URL changes
let lastUrl = null;
function updatePreview() {
  const url = $('url').value.trim();
  if (url === lastUrl) return;
  lastUrl = url;
  const box = $('preview');
  const src = previewSrc(url);
  box.textContent = url ? (src ? 'Loading…' : 'Not a web address or a file path') : 'No picture yet';
  if (!src) return;
  const img = new Image();
  img.alt = 'Picture of the piece';
  img.onload = () => { if (lastUrl === url) { box.textContent = ''; box.appendChild(img); } };
  img.onerror = () => { if (lastUrl === url) box.textContent = 'The picture did not load here. Claude may still be able to download it; check the address.'; };
  img.src = src;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) { /* fall back below */ }
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  const ok = document.execCommand('copy');
  ta.remove();
  return ok;
}

F.forEach((k) => $(k).addEventListener('input', () => {
  if (k === 'id') idTouched = $('id').value.trim() !== '';
  if (k === 'url') updatePreview();
  render();
}));

$('copy').addEventListener('click', async () => {
  const ok = await copyText(render());
  $('status').textContent = ok ? 'Copied' : 'Could not copy: select the text and press Ctrl+C';
});

$('dl').addEventListener('click', () => {
  const text = render();
  const id = $('id').value.trim() || 'piece';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  a.download = 'prompt-furniture-' + id + '.txt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

render();
</script>
</body>
</html>
